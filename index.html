<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    background: #192338;
    border-bottom: 2px solid #ff9933;
}

header h1 {
    margin: 0;
    color: #ff9933;
}

header p {
    color: #ccc;
    font-size: 14px;
}

#chat {
    max-width: 750px;
    height: 65vh;
    overflow-y: auto;
    margin: 15px auto;
    padding: 15px;
}

.message {
    padding: 13px;
    margin: 12px 0;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #234b79;
    margin-left: 35px;
}

.bot {
    background: #253044;
    margin-right: 35px;
}

#input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #192338;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #ff9933;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

@media(max-width: 500px) {
    #chat {
        height: 68vh;
    }
    button {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🇮🇳 BHARAT AI</h1>
    <p>Your Hindi & English AI Assistant</p>
</header>

<div id="chat">
    <div class="message bot">
        नमस्ते! मैं BHARAT AI हूँ। आप मुझसे हिंदी या English में सवाल पूछ सकते हैं।
    </div>
</div>

<div id="input-area">
    <input
        type="text"
        id="question"
        placeholder="अपना सवाल लिखें..."
        autocomplete="off"
    >
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
const API_URL =
"https://provision-wearing-efficiency-mothers.trycloudflare.com";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const question = input.value.trim();

    if (!question || sendBtn.disabled) return;

    addMessage(question, "user");
    input.value = "";

    sendBtn.disabled = true;
    const loading = addMessage("BHARAT AI सोच रहा है...", "bot");

    try {
        const response = await fetch(API_URL + "/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        if (!response.ok) {
            throw new Error("Server Error: " + response.status);
        }

        const data = await response.json();

        loading.textContent = data.answer || "कोई जवाब नहीं मिला।";

    } catch (error) {
        loading.textContent =
            "माफ कीजिए! BHARAT AI Server से कनेक्शन नहीं हो पाया। कृपया बाद में कोशिश करें।";

        console.error(error);

    } finally {
        sendBtn.disabled = false;
        input.focus();
    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
