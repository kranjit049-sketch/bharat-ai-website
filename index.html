<script>
const API_URL = "https://provision-wearing-efficiency-mothers.trycloudflare.com";

async function sendMessage() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const question = input.value.trim();

  if (!question) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = question;
  chat.appendChild(user);

  input.value = "";

  const bot = document.createElement("div");
  bot.className = "message bot";
  bot.textContent = "BHARAT AI सोच रहा है...";
  chat.appendChild(bot);

  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    if (!response.ok) {
      throw new Error("Server Error");
    }

    const data = await response.json();
    bot.textContent = data.answer;

  } catch (error) {
    bot.textContent = "माफ कीजिए! अभी BHARAT AI से कनेक्शन नहीं हो पा रहा है।";
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>
